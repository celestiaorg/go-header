version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    commit-message:
      prefix: "chore(deps): [medium] "
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
  - package-ecosystem: gomod
    directory: "/"
    commit-message:
      prefix: "chore(deps): [high] "
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
